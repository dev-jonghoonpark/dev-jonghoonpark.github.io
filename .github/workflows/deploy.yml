name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 하나씩. 진행 중인 배포를 취소하지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages 가 아직 꺼져 있으면 여기서 켠다 (소스: GitHub Actions).
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # 저장소 루트를 그대로 올린다. 이 액션은 .git 과 .github 을 알아서 제외한다.
      # (Pages 소스가 "Deploy from a branch" 여도 같은 결과가 나오도록 루트에 둔다)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
